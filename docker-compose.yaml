services:
  video-converter:
    image: ghcr.io/jermeyhu/video_converter:latest
    restart: unless-stopped
    environment:
      # 容器内监控目录；主机目录映射见下方 volumes。
      INPUT_DIR: /data/input
      OUTPUT_DIR: /data/output
      # 输出容器格式：mp4、mkv、mov 等；扩展名会与此设置一致，需与所选编码兼容。
      OUTPUT_FORMAT: mp4
      # 视频编码格式：h264、h265 或 av1。硬件编码优先，失败时回退 CPU。
      VIDEO_CODEC: h264
      # 音频编码器，例如 aac、libopus；copy 表示不重新编码音频流。
      AUDIO_CODEC: aac
      # 输出分辨率；留空时保持源视频分辨率，设置时宽高必须同时填写。
      OUTPUT_WIDTH: ""
      OUTPUT_HEIGHT: ""
      # 同时进行的转换数；多出的任务排队等待。
      MAX_CONCURRENT_CONVERSIONS: "1"
      # 目录扫描间隔（秒）和文件保持不变多久后才开始转换（秒）。
      POLL_INTERVAL_SECONDS: "2"
      FILE_STABILITY_SECONDS: "5"
      WEB_PORT: "${WEB_PORT:-5800}"
    ports:
      - "${WEB_PORT:-5800}:${WEB_PORT:-5800}"
    volumes:
      - "${HOST_INPUT_DIR:-./input}:/data/input"
      - "${HOST_OUTPUT_DIR:-./output}:/data/output"
    # Intel QSV/VAAPI、AMD VAAPI；纯 NVIDIA 主机需删除此段。
    devices:
      - /dev/dri:/dev/dri
    # NVIDIA：安装 NVIDIA 驱动和 Container Toolkit 后取消整个段落注释。
    # NVIDIA-only 主机同时删除上方 devices 段，避免挂载不存在的 /dev/dri。
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

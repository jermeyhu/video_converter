services:
  video-converter:
    image: ${IMAGE:-ghcr.io/jermeyhu/video_converter:latest}
    restart: unless-stopped
    environment:
      INPUT_DIR: /data/input
      OUTPUT_DIR: /data/output
      OUTPUT_FORMAT: ${OUTPUT_FORMAT:-mp4}
      VIDEO_CODEC: ${VIDEO_CODEC:-auto}
      AUDIO_CODEC: ${AUDIO_CODEC:-aac}
      OUTPUT_WIDTH: ${OUTPUT_WIDTH:-1920}
      OUTPUT_HEIGHT: ${OUTPUT_HEIGHT:-1080}
      MAX_CONCURRENT_CONVERSIONS: ${MAX_CONCURRENT_CONVERSIONS:-1}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
      FILE_STABILITY_SECONDS: ${FILE_STABILITY_SECONDS:-5}
    volumes:
      - ${HOST_INPUT_DIR:-./input}:/data/input
      - ${HOST_OUTPUT_DIR:-./output}:/data/output
